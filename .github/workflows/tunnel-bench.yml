# 隧道方案对比测试（不开放 SSH，只测哪种能拿到可用公网地址）
# 用途：一次跑完，把每个方案的结论写进 artifact，供选型。
name: tunnel-bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 准备
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          echo "runner=$(whoami) ip_start=$(curl -s --max-time 10 https://api.ipify.org)" > /tmp/out/summary.txt

      - name: 装测试工具
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # cloudflared（官方 deb，走 gh 镜像不现实，这里直接 apt 源）
          curl -fsSL --max-time 90 -o /tmp/cf.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb || echo "cloudflared 下载失败" >> /tmp/out/summary.txt
          if [ -s /tmp/cf.deb ]; then sudo dpkg -i /tmp/cf.deb >/dev/null 2>&1 || sudo apt-get -f install -y -qq >/dev/null 2>&1; fi
          echo "cloudflared=$(command -v cloudflared || echo none)" >> /tmp/out/summary.txt
          cloudflared --version >> /tmp/out/summary.txt 2>&1 || true

      - name: 测 cloudflared 快速隧道
        run: |
          set +e
          LOG=/tmp/out/cloudflared.log
          timeout 60 cloudflared tunnel --url tcp://localhost:22 --no-autoupdate > $LOG 2>&1 &
          PID=$!
          URL=""
          for i in $(seq 1 12); do
            sleep 5
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com|tcp://[^ ]+' $LOG | head -1)
            [ -n "$URL" ] && break
          done
          echo "cloudflared_url=$URL" >> /tmp/out/summary.txt
          if [ -n "$URL" ]; then
            echo "--- 探测地址是否可达 ---" >> /tmp/out/summary.txt
            curl -s -o /dev/null -w "http=%{http_code}\n" --max-time 15 "$URL" >> /tmp/out/summary.txt 2>&1
          fi
          kill $PID 2>/dev/null
          cp $LOG /tmp/out/ 2>/dev/null

      - name: 测 serveo（复现性）
        run: |
          set +e
          for n in 1 2 3; do
            LOG=/tmp/sv$n.log
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -o ExitOnForwardFailure=yes -R 0:localhost:22 serveo.net -N -v > $LOG 2>&1 &
            PID=$!
            sleep 18
            P=$(grep -oP 'Allocated port \K[0-9]+' $LOG | head -1)
            if [ -n "$P" ]; then
              echo "serveo_try$n=port $P" >> /tmp/out/summary.txt
              timeout 8 bash -c "</dev/tcp/127.0.0.1/1" 2>/dev/null
              # 从公网侧探测该端口
              R=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://serveo.net:$P" 2>/dev/null)
              echo "serveo_try$n_probe=http=$R" >> /tmp/out/summary.txt
            else
              DEBUG=$(grep -oE 'remote port forwarding failed[^"]*' $LOG | head -1)
              echo "serveo_try$n=FAIL ${DEBUG:-no-port}" >> /tmp/out/summary.txt
            fi
            kill $PID 2>/dev/null
            sleep 2
          done
          echo "ip_end=$(curl -s --max-time 10 https://api.ipify.org)" >> /tmp/out/summary.txt

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-bench
          path: /tmp/out/
          retention-days: 1

      - name: 打印汇总
        if: always()
        run: cat /tmp/out/summary.txt || true
