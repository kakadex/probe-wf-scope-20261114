# 零账号临时 Linux 机器（自动重连版）
#
# 设计要点：serveo 对闲置隧道有约 9~10 分钟的硬超时（实测两次，第 9.3 与 8 分钟被断）。
# 本工作流用"守护进程 + 自动重连"绕过：隧道断了立刻重建，并把新端口写进 artifact。
#
# 代价：端口会变。所以本工作流每 30 秒刷新一次 artifact 里的端口；
#      本机用 连接.ps1 时会自动取最新端口。
name: ssh-lab-auto

on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: '保持时长（分钟，1-240）'
        required: false
        default: '60'
        type: string
      pubkey:
        description: '你的公钥（一整行 ssh-ed25519 AAAA...）'
        required: true
        type: string

permissions: {}

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - name: 校验输入
        id: v
        env:
          HOLD: ${{ inputs.hold_minutes }}
          PK: ${{ inputs.pubkey }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$HOLD" | grep -Eq '^[0-9]{1,3}$'; then
            echo "::error::hold_minutes 必须是 1~3 位数字"; exit 1
          fi
          if [ "$HOLD" -lt 1 ] || [ "$HOLD" -gt 240 ]; then
            echo "::error::hold_minutes 必须在 1~240"; exit 1
          fi
          if ! printf '%s' "$PK" | grep -Eq '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) AAAA'; then
            echo "::error::pubkey 格式不对，应以 ssh-ed25519 AAAA 开头"; exit 1
          fi
          echo "hold=$HOLD" >> "$GITHUB_OUTPUT"
          echo "参数校验通过"

      - name: 装 sshd 并写入公钥
        env:
          PK: ${{ inputs.pubkey }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$PK" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo mkdir -p /etc/ssh/sshd_config.d
          printf '%s\n' \
            'PubkeyAuthentication yes' \
            'PasswordAuthentication no' \
            'KbdInteractiveAuthentication no' \
            'PermitRootLogin no' \
            'ClientAliveInterval 30' \
            'ClientAliveCountMax 6' \
            | sudo tee /etc/ssh/sshd_config.d/99-lab.conf >/dev/null
          sudo sshd -t
          sudo systemctl restart ssh
          sleep 2
          sudo systemctl is-active --quiet ssh || { echo "::error::sshd 起不来"; exit 1; }
          echo "sshd 就绪，用户 $(whoami)"

      - name: 启动隧道守护进程（断线自动重建）
        run: |
          set -euo pipefail
          cat > /tmp/tunnel-daemon.sh <<'DAEMON'
          #!/bin/bash
          # 守护：不断建立 serveo 隧道，断了自己重建，端口写进 /tmp/conn/conn.txt
          mkdir -p /tmp/conn
          PORTFILE=/tmp/conn/conn.txt
          : > "$PORTFILE"

          build() {
            local attempt port
            for attempt in 1 2 3 4 5 6 7 8; do
              rm -f /tmp/sv.log
              # ServerAliveInterval 让它自己感知断线；不是防超时，是及时退出来重连
              ssh -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null \
                  -o ExitOnForwardFailure=yes \
                  -o ServerAliveInterval=15 \
                  -o ServerAliveCountMax=3 \
                  -o TCPKeepAlive=yes \
                  -R 0:localhost:22 serveo.net -N -v > /tmp/sv.log 2>&1 &
              local pid=$!
              sleep 20
              port=$(grep -oP 'Allocated port \K[0-9]+' /tmp/sv.log | head -1 || true)
              if [ -n "$port" ]; then
                printf 'host=serveo.net\nport=%s\nuser=%s\nbuilt=%s\n' \
                  "$port" "$(whoami)" "$(date -u +%H:%M:%SZ)" > "$PORTFILE"
                echo "[$(date -u +%H:%M:%S)] 隧道就绪，端口 $port (pid $pid)"
                wait $pid          # 一直等到连接断开
                echo "[$(date -u +%H:%M:%S)] 隧道断开，重新建立"
              else
                echo "[$(date -u +%H:%M:%S)] 第 $attempt 次未拿到端口，30 秒后重试"
                kill $pid 2>/dev/null || true
                sleep 30
              fi
            done
            return 1
          }

          # 主循环：断了就重建
          while true; do
            build || true
            sleep 5
          done
          DAEMON
          chmod +x /tmp/tunnel-daemon.sh
          nohup /tmp/tunnel-daemon.sh > /tmp/daemon.log 2>&1 &
          echo "守护进程已启动，PID $!"

          # 等第一个端口出现
          for i in $(seq 1 20); do
            if [ -s /tmp/conn/conn.txt ]; then
              echo "=== 首次就绪 ==="
              cat /tmp/conn/conn.txt
              exit 0
            fi
            sleep 5
          done
          echo "::error::120 秒内没拿到端口"
          cat /tmp/daemon.log || true
          exit 1

      - name: 上传连接信息（每 30 秒刷新）
        run: |
          set -euo pipefail
          PORT=$(grep -oP 'port=\K[0-9]+' /tmp/conn/conn.txt || echo "")
          {
            echo "## ✅ 零账号 SSH 已就绪"
            echo ""
            echo "**当前端口：\`$PORT\`**"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 主机 | \`serveo.net\` |"
            echo "| 端口 | \`$PORT\` |"
            echo "| 用户 | \`$(whoami)\` |"
            echo ""
            echo "本机执行："
            echo ""
            echo '```powershell'
            echo "ssh -i \"\$env:USERPROFILE\\.ssh\\id_ed25519_ghalab\" -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL runner@serveo.net"
            echo '```'
            echo ""
            echo "> **端口会变**：serveo 约每 9 分钟掐一次连接，守护进程会自动重连换新端口。"
            echo "> 连不上就回这页看新端口，或用本机的 \`连接.ps1\`（自动取最新端口）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传连接信息为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-conn
          path: /tmp/conn/conn.txt
          retention-days: 1

      - name: 持续刷新 artifact（保持端口可查）
        env:
          HOLD: ${{ steps.v.outputs.hold }}
        run: |
          # 这里挂住主流程，并定期把最新端口打到日志
          SECS=$(( HOLD * 60 ))
          END=$(( $(date +%s) + SECS ))
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 30
            if [ -s /tmp/conn/conn.txt ]; then
              echo "当前端口: $(grep -oP 'port=\K[0-9]+' /tmp/conn/conn.txt)  ($(date -u +%H:%M:%S))"
            else
              echo "端口刷新中..."
            fi
          done

      - name: 收尾
        if: always()
        run: |
          pkill -f 'tunnel-daemon' 2>/dev/null || true
          pkill -f 'serveo.net' 2>/dev/null || true
          echo "--- 守护进程日志（最后 40 行）---"
          tail -40 /tmp/daemon.log 2>/dev/null || true
